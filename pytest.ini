[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
addopts = -ra -q --strict-markers --cov=apps --cov-report=term-missing
testpaths = apps
filterwarnings =
    ignore:No directory at.*:UserWarning
    ignore:Converter 'drf_format_suffix' is already registered.*:DeprecationWarning